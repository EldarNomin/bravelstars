name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  models:
    name: Blender environment and hero models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Установить Blender 4.5.15 LTS
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://download.blender.org/release/Blender4.5"
          archive="blender-4.5.15-linux-x64.tar.xz"
          curl --fail --location --retry 3 --silent --show-error -O "$base/$archive"
          curl --fail --location --retry 3 --silent --show-error -O "$base/blender-4.5.15.sha256"
          grep " $archive$" blender-4.5.15.sha256 | sha256sum --check --strict
          tar -xf "$archive"
          echo "$RUNNER_TEMP/blender-4.5.15-linux-x64" >> "$GITHUB_PATH"
      - name: Пересобрать и проверить GLB
        run: |
          set -euo pipefail
          blender -b --python-exit-code 1 -P tools/blender/test_validation.py
          blender -b --python-exit-code 1 -P tools/blender/build_all.py -- --output-dir "$RUNNER_TEMP/a01-models"
          blender -b --python-exit-code 1 -P tools/blender/verify_all.py -- --input-dir "$RUNNER_TEMP/a01-models"
          for model in "$RUNNER_TEMP"/a01-models/*.glb; do
            cmp "$model" "assets/models/env/$(basename "$model")"
          done
          blender -b --python-exit-code 1 -P tools/blender/build_heroes.py -- --output-dir "$RUNNER_TEMP/a02-heroes"
          blender -b --python-exit-code 1 -P tools/blender/verify_heroes.py -- --input-dir "$RUNNER_TEMP/a02-heroes"
          blender -b --python-exit-code 1 -P tools/blender/compare_heroes.py -- --rebuilt "$RUNNER_TEMP/a02-heroes" --committed assets/models/heroes
          blender -b --python-exit-code 1 -P tools/blender/build_fx.py -- --output-dir "$RUNNER_TEMP/a04-fx"
          blender -b --python-exit-code 1 -P tools/blender/verify_fx.py -- --input-dir "$RUNNER_TEMP/a04-fx" --compare-dir assets/models/fx
      - name: Проверить импорт в Godot
        run: |
          set -euo pipefail
          tools/ci_install_godot.sh
          ~/godot/godot --headless --editor --import
          ~/godot/godot --headless -s tools/blender/check_godot.gd
          ~/godot/godot --headless -s tools/blender/check_heroes.gd
          ~/godot/godot --headless -s tools/blender/check_fx.gd

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ hashFiles('.godot-version') }}
      - name: Установить Godot
        run: tools/ci_install_godot.sh
      - name: Бенчмарк симуляции (10000 тиков)
        run: |
          ~/godot/godot --headless --editor --import
          ~/godot/godot --headless --scene res://scenes/bench/bench.tscn -- --bench-sim
      - name: gdlint
        run: |
          pip install "gdtoolkit==4.*"
          gdlint src tests tools
      - name: Тесты
        run: |
          bash tests/tools/test_run_tests.sh
          tools/run_tests.sh ~/godot/godot

  scene-smoke:
    name: Real scenes and HUD screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ hashFiles('.godot-version') }}
      - name: Install renderer and Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth ffmpeg libgl1-mesa-dri
          python3 -m pip install --user 'Pillow>=10,<14'
          tools/ci_install_godot.sh
      - name: Smoke scenes and rendered HUD
        env:
          SMOKE_OUTPUT_DIR: ${{ runner.temp }}/scene-smoke
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          python3 tools/scene_smoke/test_check_frame.py
          bash tools/scene_smoke/run.sh ~/godot/godot
      - name: Upload logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-smoke
          path: |
            ${{ runner.temp }}/scene-smoke/*.log
            ${{ runner.temp }}/scene-smoke/*.png
          if-no-files-found: warn

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-templates-${{ hashFiles('.godot-version') }}
      - name: Установить Godot и шаблоны экспорта
        run: tools/ci_install_godot.sh templates
      - name: Настроить Android SDK и debug-ключ
        run: |
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          ~/godot/godot --headless --editor --quit
          SETTINGS=$(ls ~/.config/godot/editor_settings-*.tres)
          sed -i '/^export\/android\//d' "$SETTINGS"
          {
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo "export/android/debug_keystore_user = \"androiddebugkey\""
            echo "export/android/debug_keystore_pass = \"android\""
          } >> "$SETTINGS"
      - name: Экспорт debug APK
        run: |
          mkdir -p build
          ~/godot/godot --headless --import
          ~/godot/godot --headless --export-debug "Android" build/bravelstars-debug.apk
          ls -la build
          test -s build/bravelstars-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bravelstars-debug-apk
          path: build/bravelstars-debug.apk
          retention-days: 14
      - name: Экспорт отдельного APK бенчмарка
        run: |
          python3 - <<'PY'
          from pathlib import Path
          preset = Path('export_presets.cfg')
          text = preset.read_text(encoding='utf-8')
          old_package = 'package/unique_name="com.eldarnomin.bravelstars"'
          assert old_package in text and 'tools/*, ' in text
          text = text.replace(old_package, 'package/unique_name="com.eldarnomin.bravelstars.bench"')
          text = text.replace('tools/*, ', '')
          text = text.replace('[preset.0.options]', '[preset.0.options]\n'
              'command_line/extra_args="--scene res://scenes/bench/bench.tscn"', 1)
          preset.write_text(text, encoding='utf-8')
          PY
          ~/godot/godot --headless --export-debug "Android" build/bravelstars-bench.apk
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('build/bravelstars-bench.apk') as apk:
              names = apk.namelist()
              assert apk.testzip() is None
              assert 'assets/data/maps/_debug_arena.json' in names
              assert 'assets/tools/bench/bench.gdc' in names
              assert 'assets/tools/bench/bench_workload.gdc' in names
              assert 'lib/arm64-v8a/libgodot_android.so' in names
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bravelstars-benchmark-apk
          path: build/bravelstars-bench.apk
          if-no-files-found: error
          retention-days: 14

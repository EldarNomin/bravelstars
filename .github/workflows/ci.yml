name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  models:
    name: Blender environment models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Установить Blender 4.5.15 LTS
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://download.blender.org/release/Blender4.5"
          archive="blender-4.5.15-linux-x64.tar.xz"
          curl --fail --location --retry 3 --silent --show-error -O "$base/$archive"
          curl --fail --location --retry 3 --silent --show-error -O "$base/blender-4.5.15.sha256"
          grep " $archive$" blender-4.5.15.sha256 | sha256sum --check --strict
          tar -xf "$archive"
          echo "$RUNNER_TEMP/blender-4.5.15-linux-x64" >> "$GITHUB_PATH"
      - name: Пересобрать и проверить GLB
        run: |
          set -euo pipefail
          blender -b --python-exit-code 1 -P tools/blender/test_validation.py
          blender -b --python-exit-code 1 -P tools/blender/build_all.py -- --output-dir "$RUNNER_TEMP/a01-models"
          blender -b --python-exit-code 1 -P tools/blender/verify_all.py -- --input-dir "$RUNNER_TEMP/a01-models"
          for model in "$RUNNER_TEMP"/a01-models/*.glb; do
            cmp "$model" "assets/models/env/$(basename "$model")"
          done
      - name: Проверить импорт в Godot
        run: |
          set -euo pipefail
          tools/ci_install_godot.sh
          ~/godot/godot --headless --editor --import
          ~/godot/godot --headless -s tools/blender/check_godot.gd

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ hashFiles('.godot-version') }}
      - name: Установить Godot
        run: tools/ci_install_godot.sh
      - name: gdlint
        run: |
          pip install "gdtoolkit==4.*"
          gdlint src tests tools
      - name: Тесты
        run: tools/run_tests.sh ~/godot/godot

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-templates-${{ hashFiles('.godot-version') }}
      - name: Установить Godot и шаблоны экспорта
        run: tools/ci_install_godot.sh templates
      - name: Настроить Android SDK и debug-ключ
        run: |
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          ~/godot/godot --headless --editor --quit >/dev/null 2>&1 || true
          SETTINGS=$(ls ~/.config/godot/editor_settings-*.tres)
          sed -i '/^export\/android\//d' "$SETTINGS"
          {
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo "export/android/debug_keystore_user = \"androiddebugkey\""
            echo "export/android/debug_keystore_pass = \"android\""
          } >> "$SETTINGS"
      - name: Экспорт debug APK
        run: |
          mkdir -p build
          ~/godot/godot --headless --import >/dev/null 2>&1 || true
          ~/godot/godot --headless --export-debug "Android" build/bravelstars-debug.apk
          ls -la build
          test -s build/bravelstars-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bravelstars-debug-apk
          path: build/bravelstars-debug.apk
          retention-days: 14

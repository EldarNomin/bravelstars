name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ hashFiles('.godot-version') }}
      - name: Установить Godot
        run: tools/ci_install_godot.sh
      - name: Бенчмарк симуляции (10000 тиков)
        run: |
          ~/godot/godot --headless --editor --import
          ~/godot/godot --headless --scene res://scenes/bench/bench.tscn -- --bench-sim
      - name: gdlint
        run: |
          pip install "gdtoolkit==4.*"
          gdlint src tests tools
      - name: Тесты
        run: tools/run_tests.sh ~/godot/godot

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-templates-${{ hashFiles('.godot-version') }}
      - name: Установить Godot и шаблоны экспорта
        run: tools/ci_install_godot.sh templates
      - name: Настроить Android SDK и debug-ключ
        run: |
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          ~/godot/godot --headless --editor --quit >/dev/null 2>&1 || true
          SETTINGS=$(ls ~/.config/godot/editor_settings-*.tres)
          sed -i '/^export\/android\//d' "$SETTINGS"
          {
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo "export/android/debug_keystore_user = \"androiddebugkey\""
            echo "export/android/debug_keystore_pass = \"android\""
          } >> "$SETTINGS"
      - name: Экспорт debug APK
        run: |
          mkdir -p build
          ~/godot/godot --headless --import >/dev/null 2>&1 || true
          ~/godot/godot --headless --export-debug "Android" build/bravelstars-debug.apk
          ls -la build
          test -s build/bravelstars-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bravelstars-debug-apk
          path: build/bravelstars-debug.apk
          retention-days: 14
      - name: Экспорт отдельного APK бенчмарка
        run: |
          python3 - <<'PY'
          from pathlib import Path
          preset = Path('export_presets.cfg')
          text = preset.read_text(encoding='utf-8')
          old_package = 'package/unique_name="com.eldarnomin.bravelstars"'
          assert old_package in text and 'tools/*, ' in text
          text = text.replace(old_package, 'package/unique_name="com.eldarnomin.bravelstars.bench"')
          text = text.replace('tools/*, ', '')
          text = text.replace('[preset.0.options]', '[preset.0.options]\n'
              'command_line/extra_args="--scene res://scenes/bench/bench.tscn"', 1)
          preset.write_text(text, encoding='utf-8')
          PY
          ~/godot/godot --headless --export-debug "Android" build/bravelstars-bench.apk
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('build/bravelstars-bench.apk') as apk:
              names = apk.namelist()
              assert apk.testzip() is None
              assert 'assets/data/maps/_debug_arena.json' in names
              assert 'assets/tools/bench/bench.gdc' in names
              assert 'assets/tools/bench/bench_workload.gdc' in names
              assert 'lib/arm64-v8a/libgodot_android.so' in names
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bravelstars-benchmark-apk
          path: build/bravelstars-bench.apk
          if-no-files-found: error
          retention-days: 14

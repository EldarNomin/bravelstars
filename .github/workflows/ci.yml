name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ hashFiles('.godot-version') }}
      - name: Установить Godot
        run: tools/ci_install_godot.sh
      - name: gdlint
        run: |
          pip install "gdtoolkit==4.*"
          gdlint src tests tools
      - name: Тесты
        run: |
          bash tests/tools/test_run_tests.sh
          tools/run_tests.sh ~/godot/godot

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-templates-${{ hashFiles('.godot-version') }}
      - name: Установить Godot и шаблоны экспорта
        run: tools/ci_install_godot.sh templates
      - name: Настроить Android SDK и debug-ключ
        run: |
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          ~/godot/godot --headless --editor --quit
          SETTINGS=$(ls ~/.config/godot/editor_settings-*.tres)
          sed -i '/^export\/android\//d' "$SETTINGS"
          {
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo "export/android/debug_keystore_user = \"androiddebugkey\""
            echo "export/android/debug_keystore_pass = \"android\""
          } >> "$SETTINGS"
      - name: Экспорт debug APK
        run: |
          mkdir -p build
          ~/godot/godot --headless --import
          ~/godot/godot --headless --export-debug "Android" build/bravelstars-debug.apk
          ls -la build
          test -s build/bravelstars-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bravelstars-debug-apk
          path: build/bravelstars-debug.apk
          retention-days: 14
